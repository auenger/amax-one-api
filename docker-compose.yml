version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aihub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: aihub
      POSTGRES_DB: aihub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aihub']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aihub-net

  redis:
    image: redis:7-alpine
    container_name: aihub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aihub-net

  aihub:
    build:
      context: ./aihub
      dockerfile: Dockerfile
    container_name: aihub
    restart: unless-stopped
    ports:
      - '3000:3000'
      - '8765:8765'
      - '8766:8766'
    environment:
      SQL_DSN: postgres://aihub:aihub@postgres:5432/aihub?sslmode=disable
      REDIS_CONN_STRING: redis://redis:6379
      MEMORY_CACHE_ENABLED: "true"
      SYNC_FREQUENCY: 60
      BATCH_UPDATE_ENABLED: "true"
      RETRY_TIMES: 3
      CHANNEL_DISABLE_THRESHOLD: 5
      INITIAL_ROOT_TOKEN: sk-aihub-root-token-change-me
      THEME: web
      # MCP services (optional, only start when API key is set)
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_HOST: ${MINIMAX_API_HOST:-https://api.minimaxi.com}
      MINIMAX_MCP_PORT: ${MINIMAX_MCP_PORT:-8765}
      Z_AI_API_KEY: ${Z_AI_API_KEY:-}
      Z_AI_MODE: ${Z_AI_MODE:-ZHIPU}
      Z_AI_MCP_PORT: ${Z_AI_MCP_PORT:-8766}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aihub-net

volumes:
  postgres_data:
  redis_data:

networks:
  aihub-net:
    driver: bridge
