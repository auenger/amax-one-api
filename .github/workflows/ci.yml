name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config -q

      - name: Check directory structure
        run: |
          # Ensure old architecture directories are gone
          ! test -d apps/gateway || (echo "ERROR: apps/gateway still exists" && exit 1)
          ! test -d apps/web || (echo "ERROR: apps/web still exists" && exit 1)
          ! test -d packages/database || (echo "ERROR: packages/database still exists" && exit 1)
          ! test -d packages/shared || (echo "ERROR: packages/shared still exists" && exit 1)
          echo "Directory structure clean"
