version: '3.4'

services:
  aihub:
    image: aihub:latest
    container_name: aihub
    restart: always
    ports:
      - "3000:3000"
      - "8765:8765"
      - "8766:8766"
    environment:
      # PostgreSQL — 改成你实际的连接信息
      - SQL_DSN=postgres://aihub:your_password@your-pg-host:5432/aihub?sslmode=disable
      # Redis — 改成你实际的连接信息
      - REDIS_CONN_STRING=redis://your-redis-host:6379
      # 如果 Redis 有密码: redis://:password@your-redis-host:6379
      # session 加密密钥，务必改成随机字符串
      - SESSION_SECRET=change_me_to_random_string
      - TZ=Asia/Shanghai
      # web 前端主题
      - THEME=web
      # MCP services (optional — set API key to enable)
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_API_HOST=${MINIMAX_API_HOST:-https://api.minimaxi.com}
      - MINIMAX_MCP_PORT=${MINIMAX_MCP_PORT:-8765}
      - Z_AI_API_KEY=${Z_AI_API_KEY:-}
      - Z_AI_MODE=${Z_AI_MODE:-ZHIPU}
      - Z_AI_MCP_PORT=${Z_AI_MCP_PORT:-8766}
