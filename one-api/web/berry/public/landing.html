<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <title>AIHub — 多模型 All-in-One AI 管理平台</title>
    <link rel="icon" href="/favicon.ico" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e27" />
    <meta name="description" content="AIHub — 企业级 AI 管理平台，支持 OpenAI 和 Anthropic 双协议，38 供应商统一接入，智能路由，并发追踪，配额监控" />
    <style>
      /* ============ Reset & Base ============ */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        color: #e0e6f0;
        background: #0a0e27;
        line-height: 1.6;
        overflow: hidden;
      }
      a { color: inherit; text-decoration: none; }

      /* ============ Hero ============ */
      .hero {
        position: relative;
        width: 100vw; height: 100vh;
        display: flex; align-items: center;
        padding: 0 2rem;
        background: linear-gradient(160deg, #0a0e27 0%, #111b47 40%, #0d1b3e 70%, #0a0e27 100%);
        overflow: hidden;
      }
      .hero::before {
        content: ''; position: absolute;
        width: 600px; height: 600px; border-radius: 50%;
        background: radial-gradient(circle, rgba(79,125,249,0.15) 0%, transparent 70%);
        top: -200px; left: -100px; pointer-events: none;
      }
      .hero::after {
        content: ''; position: absolute;
        width: 500px; height: 500px; border-radius: 50%;
        background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
        bottom: -150px; right: -100px; pointer-events: none;
      }

      .hero-content {
        max-width: 1200px; margin: 0 auto; width: 100%;
        display: flex; align-items: center; gap: 4rem;
        position: relative; z-index: 2;
      }
      .hero-text { flex: 1; max-width: 580px; }
      .hero-badge {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 16px; border-radius: 50px;
        border: 1px solid rgba(79,125,249,0.4);
        background: rgba(79,125,249,0.08);
        font-size: 0.75rem; font-weight: 600;
        letter-spacing: 0.1em; text-transform: uppercase;
        color: #7da3fc; margin-bottom: 2rem;
      }
      .hero-badge .pulse-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #4f7df9; position: relative;
      }
      .hero-badge .pulse-dot::after {
        content: ''; position: absolute; inset: -3px;
        border-radius: 50%; border: 2px solid #4f7df9;
        animation: badge-pulse 2s ease-in-out infinite;
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0; transform: scale(2); }
      }
      .hero-title {
        font-size: clamp(2.5rem, 5.5vw, 4rem);
        font-weight: 800; line-height: 1.1;
        letter-spacing: -0.03em; margin-bottom: 1.5rem;
      }
      .hero-title .line1 {
        display: block; color: rgba(224,230,240,0.6);
        font-size: clamp(1.2rem, 2.5vw, 1.8rem);
        font-weight: 500; letter-spacing: 0.05em;
        margin-bottom: 0.75rem;
      }
      .hero-title .line2 {
        display: block;
        background: linear-gradient(90deg, #4f7df9 0%, #a78bfa 50%, #4f7df9 100%);
        background-size: 200% 100%;
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradient-shift 4s ease infinite;
      }
      @keyframes gradient-shift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      .hero-subtitle {
        font-size: 1.125rem; color: rgba(224,230,240,0.65);
        line-height: 1.7; margin-bottom: 2rem; max-width: 480px;
      }
      .hero-protocols {
        display: flex; gap: 12px; margin-bottom: 2.5rem; flex-wrap: wrap;
      }
      .protocol-tag {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 16px; border-radius: 10px;
        font-size: 0.85rem; font-weight: 600;
        font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      }
      .protocol-openai {
        background: rgba(16,163,127,0.12); border: 1px solid rgba(16,163,127,0.3);
        color: #10a37f;
      }
      .protocol-openai svg { fill: #10a37f; }
      .protocol-anthropic {
        background: rgba(217,119,6,0.12); border: 1px solid rgba(217,119,6,0.3);
        color: #d97706;
      }
      .protocol-anthropic svg { fill: #d97706; }

      /* ============ Hero SVG Network ============ */
      .hero-svg-container {
        position: absolute;
        top: 240px;
        right: 100px;
        width: min(520px, 45vw);
        pointer-events: none;
        z-index: 1;
      }
      @media (max-width: 768px) {
        .hero-svg-container { display: none; }
        .hero-text { max-width: 100%; }
      }
    </style>
